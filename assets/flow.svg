<circle r="4" fill="#a5f3fc" opacity="0"><animateMotion dur="5s" begin="3.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.18;1" calcMode="linear" path="M775 120.0 L825 120.0"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.16;.19;1" dur="5s" begin="3.4s" repeatCount="indefinite"/></circle>
<rect x="825" y="84" width="150" height="72" rx="12" fill="#0a1220" stroke="#22324d"/>
<rect x="825" y="84" width="150" height="72" rx="12" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;1;1;0;0" keyTimes="0;.06;.2;.4;1" dur="5s" begin="4s" repeatCount="indefinite"/></rect>
<text x="839" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#22d3ee">05</text>
<text x="839" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Staff follow-up</text>
