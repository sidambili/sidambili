<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" role="presentation">
<defs>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<clipPath id="line"><rect x="0" y="3" width="1000" height="2" rx="1"/></clipPath>
</defs>
<rect x="0" y="3" width="1000" height="2" rx="1" fill="#94a3b8" fill-opacity=".25"/>
<g clip-path="url(#line)"><rect x="-260" y="0" width="260" height="8" fill="url(#shine)"><animate attributeName="x" from="-260" to="1000" dur="4.5s" repeatCount="indefinite"/></rect></g>
</svg>